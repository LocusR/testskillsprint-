name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Паралельні деплої Pages конфліктують — лишаємо тільки найсвіжіший
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # playwright у devDependencies тягне ~150 МБ браузерів на postinstall.
      # Для збірки сайту вони не потрібні.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Визначити базовий шлях
        # Pages віддає сайт із підпапки /<repo>/, тож base мусить її враховувати.
        # Раніше це була ручна змінна BASE_PATH — і саме про неї легко забути,
        # а наслідок непомітний: сторінка відкривається, але бандл шукається
        # у корені домену й віддає 404, тобто білий екран.
        # Тепер шлях виводиться з назви репозиторію автоматично.
        # Змінну BASE_PATH лишено як перевизначення: для власного домену
        # достатньо поставити її в "/".
        run: |
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "BASE_PATH=${{ vars.BASE_PATH }}" >> "$GITHUB_ENV"
            echo "base з перевизначення: ${{ vars.BASE_PATH }}"
          else
            AUTO="/${GITHUB_REPOSITORY#*/}/"
            echo "BASE_PATH=$AUTO" >> "$GITHUB_ENV"
            echo "base з назви репозиторію: $AUTO"
          fi

      - name: Зібрати фронтенд
        run: npm run build --workspace client
        env:
          # VITE_* вшиваються у бандл на етапі збірки, тому саме тут.
          # Задається у Settings -> Secrets and variables -> Actions.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: SPA-fallback
        # GitHub Pages не має rewrite-правил: невідомий шлях віддає 404.html.
        # Копія index.html робить із неї точку входу застосунку, і глибокі
        # посилання (/blog/стаття) починають працювати.
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
