server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Стиснення текстових ресурсів
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Не світимо версію nginx
    server_tokens off;

    # Базові захисні заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API віддаємо Express-сервісу. Так фронт і бекенд на одному origin,
    # і CORS у продакшні взагалі не потрібен.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # rate-limit на бекенді читає саме цей заголовок (app.set('trust proxy', 1))
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Хешовані ассети Vite можна кешувати назавжди
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Картинки з public/ — теж довгий кеш
    location ~* \.(png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html не кешуємо — інакше після релізу віддамо старі посилання на бандли
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA-fallback: усі маршрути роутера віддаємо index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
